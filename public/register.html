<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Créer un compte - Sport Social</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>⚽ Sport Social</h1>
    <p>Créer ton compte</p>
  </header>

  <main>

    <div class="card">

      <h2>Créer un compte</h2>

      <br>

      <form id="registerForm">

        <label for="username">
          Nom d'utilisateur
        </label>

        <br><br>

        <input
          type="text"
          id="username"
          placeholder="Ex : joueur123"
          required
        >

        <br><br>

        <label for="email">
          Adresse e-mail
        </label>

        <br><br>

        <input
          type="email"
          id="email"
          placeholder="exemple@email.com"
          required
        >

        <br><br>

        <label for="password">
          Mot de passe
        </label>

        <br><br>

        <input
          type="password"
          id="password"
          placeholder="Mot de passe"
          required
        >

        <br><br>

        <button type="submit">
          Créer mon compte
        </button>

      </form>

      <br>

      <a href="index.html">
        ← Retour à l'accueil
      </a>

    </div>

  </main>

  <script src="app.js"></script>

</body>
</html>
